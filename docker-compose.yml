version: "3.8"

services:

  api:
    build: .
    ports:
      - "8080:8080"
    depends_on:
      - db
    env_file:
      - go.env
    restart: always

  db:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: gita
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

volumes:
  postgres_data: